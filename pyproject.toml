[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pad-celeba-spoof"
version = "0.1.0"
description = "Single-image face Presentation Attack Detection (CEleA-Spoof subset), DINOv2 backbone with BCE + depth-MSE(Smooth-L1) + high-frequency branch + spoof-type supervision"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "numpy",
    "pandas",
    "scikit-learn",
    "PyYAML",
    "tqdm",
    "matplotlib",
    "opencv-python>=5.0.0.93",
    "transformers>=4.40",
    "fire>=0.5",
    "insightface>=1.0.1",
    "python-dotenv>=1.2.1",
    "ruff>=0.16.5",
    "pytest>=8.4.2",
    "ty>=0.0.77",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Local/macOS installs use PyPI. For CUDA PyTorch wheels on a GPU host, either
# pass `--index-url https://download.pytorch.org/whl/cu121` to uv, or install
# torch/torchvision from the PyTorch index before `uv sync` (see docs/ONBOARDING.md).
index-url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
