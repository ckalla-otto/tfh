[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pad-celeba-spoof"
version = "0.1.0"
description = "Single-image face Presentation Attack Detection (CEleA-Spoof subset), DINOv2 backbone with BCE + depth-MSE(Smooth-L1) + high-frequency branch + spoof-type supervision"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "numpy",
    "pandas",
    "scikit-learn",
    "PyYAML",
    "tqdm",
    "matplotlib",
    "opencv-python>=5.0.0.93",
    "transformers>=4.40",
    "kaggle",
    "fire>=0.5",
    "insightface>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# PyTorch CUDA wheels available on the T4 VM via a custom index; local/macOS CPU
# installs use PyPI. See scripts/setup_gpu_vm.sh for the CUDA index workflow.
index-url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
