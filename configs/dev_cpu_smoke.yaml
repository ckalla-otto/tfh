# Local CPU smoke config: tiny synthetic crawl, small backbone, depth off.
# Validates the train entry point without GPU/data. NOT for real experiments.
include: [base.yaml]

out_dir: results/dev_cpu

data:
  root: /tmp/pad_smoke
  crawl_meta: /tmp/pad_smoke/crawl.csv
  subsets_dir: /tmp/pad_smoke/subsets_dev
  subset:
    budget_total: 360

model:
  backbone: vit_small_patch14_dinov2

depth:
  enabled: false

train:
  epochs: 1
  batch_size: 4
  workers: 0
  log_every: 5